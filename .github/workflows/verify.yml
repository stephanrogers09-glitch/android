name: Verify

# Builds and tests every push to the feature branch and every pull request. Runs on GitHub-hosted
# runners, which have the Android SDK and network access to Google's Maven repository.
on:
  push:
    branches: [feature/cross-platform-foundation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm-checks:
    name: Shared core and allowlist (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          # 8.14.3 ships the Kotlin compiler's runtime dependencies (kotlinx-coroutines) in lib/.
          gradle-version: "8.14.3"
      - name: Locate Gradle's Kotlin compiler jars
        id: kotlin
        run: |
          LIB="$(dirname "$(readlink -f "$(which gradle)")")/../lib"
          echo "lib=$(readlink -f "$LIB")" >> "$GITHUB_OUTPUT"
          ls "$LIB" | grep -E "kotlin-compiler-embeddable|kotlin-stdlib" | head
      - name: Compile and run pure-Kotlin checks (-Werror)
        env:
          KOTLIN_LIB_DIR: ${{ steps.kotlin.outputs.lib }}
        run: scripts/verify-kotlin.sh

  backend-db:
    name: Database migration and RLS tests (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Run migration and SQL tests
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: test
        run: backend/scripts/test-db.sh

  backend-functions:
    name: ai-assist Edge Function logic (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned TypeScript
        run: npm install -g typescript@5.6.3
      - name: Type-check and run handler tests
        run: backend/scripts/test-functions.sh

  android-apk:
    name: Debug APK build
    runs-on: ubuntu-latest
    needs: [jvm-checks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Assemble debug APK
        # Public values only (project URL and publishable key). Set them as repository VARIABLES, not secrets.
        # If they are unset the APK still builds and shows the in-app setup message.
        env:
          LOCKEDIN_SUPABASE_URL: ${{ vars.LOCKEDIN_SUPABASE_URL }}
          LOCKEDIN_SUPABASE_ANON_KEY: ${{ vars.LOCKEDIN_SUPABASE_ANON_KEY }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Check APK contents and signature
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          unzip -l "$APK" | grep -q "classes.dex" || { echo "no classes.dex in APK"; exit 1; }
          unzip -l "$APK" | grep -q "AndroidManifest.xml" || { echo "no manifest in APK"; exit 1; }
          unzip -p "$APK" AndroidManifest.xml | tr -d '\000' | grep -q "StudyActivity" || { echo "StudyActivity not declared"; exit 1; }
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | head -n 3
          ls -l "$APK"
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: lockedin-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  shared-ts:
    name: Shared rules for web and desktop (TypeScript, spec vectors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned TypeScript
        run: npm install -g typescript@5.6.3
      - name: Build (strict) and run spec tests
        working-directory: platforms/shared-ts
        run: npm test

  shared-apple:
    name: Shared rules for iOS and macOS (Swift, spec vectors)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift package tests
        run: swift test --package-path platforms/apple/LockedInCore

  android-instrumented:
    name: Keystore session storage on an Android emulator (API 30)
    runs-on: ubuntu-latest
    needs: [jvm-checks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on-device Keystore tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_5
          script: gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

  release-guard:
    name: Release signing must refuse to build without a keystore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: The build file never references the debug signing key
        run: |
          if grep -q 'getByName("debug")' app/build.gradle.kts; then
            echo "app/build.gradle.kts still references the debug signing config"; exit 1
          fi
      - name: Release build without settings must fail with the guard message
        run: |
          set +e
          gradle :app:assembleRelease --no-daemon > release.log 2>&1
          code=$?
          set -e
          cat release.log | tail -n 30
          if [ "$code" -eq 0 ]; then
            echo "release build succeeded without release signing settings"; exit 1
          fi
          grep -q "Release build needs a release keystore" release.log || { echo "guard message missing"; exit 1; }
          grep -q "debug key is never used" release.log || { echo "guard message incomplete"; exit 1; }
          echo "release guard works"

